<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生物合格考 · 基础闯关</title>
<style>
:root {
  --bg:       #f7f6f3;
  --card:     #ffffff;
  --border:   #e6e3dd;
  --text:     #5b5956;
  --text-dim: #9a9792;
  --correct-bg: #eef3ed;
  --correct-fg: #6b8b6b;
  --wrong-bg:   #f5eeea;
  --wrong-fg:   #b59380;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  padding: 0;
}

.wrap {
  max-width: 640px;
  width: 100%;
  padding: 24px 20px 40px;
}

/* ---- header ---- */
.header {
  text-align: center;
  padding-bottom: 22px;
  margin-bottom: 22px;
  border-bottom: 1px solid var(--border);
}
.header h1 {
  font-size: 20px;
  font-weight: 500;
  color: var(--text);
  letter-spacing: .02em;
}
.header .sub {
  font-size: 12px;
  color: var(--text-dim);
  margin-top: 5px;
  letter-spacing: .03em;
}

/* ---- stats row ---- */
.stats {
  display: flex;
  justify-content: center;
  gap: 36px;
  margin-bottom: 20px;
}
.stat { text-align: center; }
.stat .num {
  font-size: 24px;
  font-weight: 400;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}
.stat .lbl {
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: .05em;
  margin-top: 2px;
}

/* ---- progress ---- */
.progress-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 22px;
}
.progress-bar {
  flex: 1;
  height: 2px;
  background: var(--border);
  border-radius: 1px;
}
.progress-fill {
  height: 100%;
  background: var(--correct-fg);
  border-radius: 1px;
  transition: width .4s ease;
}
.progress-num {
  font-size: 12px;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
  min-width: 38px;
  text-align: right;
}

/* ---- card ---- */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 22px 20px;
  margin-bottom: 14px;
}
.card .tag {
  display: inline-block;
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 3px;
  margin-bottom: 12px;
  letter-spacing: .04em;
  color: var(--text-dim);
  border: 1px solid var(--border);
}
.card .idx {
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 8px;
}
.card .stem {
  font-size: 17px;
  line-height: 1.8;
  color: var(--text);
  font-weight: 450;
}

/* ---- options ---- */
.options {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 14px;
}
.opt {
  width: 100%;
  padding: 15px 16px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--card);
  cursor: pointer;
  font-size: 15px;
  color: var(--text);
  text-align: left;
  font-family: inherit;
  transition: background .12s, border-color .12s;
  display: flex;
  align-items: center;
  gap: 12px;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
.opt:active { background: #f5f4f0; }

.opt .letter {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-dim);
  flex-shrink: 0;
  transition: all .2s;
}

/* states */
.opt.correct { border-color: var(--correct-fg); background: var(--correct-bg); }
.opt.correct .letter { border-color: var(--correct-fg); background: var(--correct-fg); color: #fff; }
.opt.wrong   { border-color: var(--wrong-fg); background: var(--wrong-bg); }
.opt.wrong .letter   { border-color: var(--wrong-fg); background: var(--wrong-fg); color: #fff; }
.opt.reveal  { border-color: var(--correct-fg); background: var(--correct-bg); }
.opt.reveal .letter  { border-color: var(--correct-fg); background: var(--correct-fg); color: #fff; }
.opt:disabled { pointer-events: none; }

/* ---- feedback ---- */
.fb {
  padding: 14px 16px;
  border-radius: 10px;
  font-size: 14px;
  line-height: 1.75;
  margin-bottom: 14px;
  display: none;
}
.fb.on { display: block; }
.fb.ok  { background: var(--correct-bg); color: var(--correct-fg); }
.fb.bad { background: var(--wrong-bg); color: var(--wrong-fg); }

/* ---- buttons ---- */
.btns { display: flex; gap: 10px; }
.btn {
  flex: 1;
  padding: 14px 18px;
  border-radius: 10px;
  border: 1px solid var(--border);
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  background: var(--card);
  color: var(--text);
  font-family: inherit;
  letter-spacing: .02em;
  transition: background .12s, border-color .12s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
.btn:active { background: #f5f4f0; }
.btn.primary {
  background: var(--correct-fg);
  color: #fff;
  border-color: var(--correct-fg);
}
.btn.primary:active { opacity: .85; }

/* ---- result ---- */
.result { text-align: center; display: none; }
.result.on { display: block; }

.result .emoji { font-size: 48px; margin-bottom: 10px; }
.result h2 { font-size: 20px; font-weight: 500; color: var(--text); margin-bottom: 8px; }
.result .detail { font-size: 14px; color: var(--text-dim); line-height: 2; margin-bottom: 20px; }

.tips-card {
  text-align: left;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 18px 20px;
  margin-bottom: 20px;
}
.tips-card h3 { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 8px; }
.tips-card li { font-size: 13px; color: var(--text-dim); line-height: 2; list-style: none; }
.tips-card li::before { content: '— '; color: var(--border); }

/* ---- desktop hover (only when hover is available) ---- */
@media (hover: hover) {
  .opt:hover { background: #fafaf8; border-color: #d5d1c8; }
  .btn:hover { background: #fafaf8; border-color: #d5d1c8; }
  .btn.primary:hover { opacity: .9; }
}
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <h1>生物合格考 · 基础闯关</h1>
    <div class="sub">上海高中 · 必修一 & 必修二</div>
  </div>

  <div class="stats">
    <div class="stat"><div class="num" id="ok">0</div><div class="lbl">正确</div></div>
    <div class="stat"><div class="num" id="bad">0</div><div class="lbl">错误</div></div>
    <div class="stat"><div class="num" id="streak">0</div><div class="lbl">连对</div></div>
  </div>

  <div class="progress-row">
    <div class="progress-bar"><div class="progress-fill" id="bar" style="width:0%"></div></div>
    <div class="progress-num" id="pnum">0/20</div>
  </div>

  <div id="playArea">
    <div class="card">
      <div class="tag" id="tag"></div>
      <div class="idx" id="idx"></div>
      <div class="stem" id="stem"></div>
    </div>
    <ul class="options" id="opts"></ul>
    <div class="fb" id="fb"></div>
    <div class="btns">
      <button class="btn" id="hintBtn" onclick="doHint()">提示</button>
      <button class="btn primary" id="nextBtn" onclick="doNext()" style="display:none">下一题</button>
    </div>
  </div>

  <div class="result" id="resultArea">
    <div class="emoji" id="remj"></div>
    <h2 id="rtitle"></h2>
    <div class="detail" id="rdetail"></div>
    <div class="tips-card" id="rtips"></div>
    <button class="btn primary" onclick="restart()" style="width:100%">再来一轮</button>
  </div>
</div>

<script>
// ==============================  题库 (60题)  ==============================
const Q = [
  // ========== 必修一：细胞的分子组成 ==========
  { b:1, c:'细胞的分子组成', q:'蛋白质的基本组成单位是？', o:['葡萄糖','氨基酸','核苷酸','脂肪酸'], a:1,
    h:'蛋白质是由氨基酸通过肽键连接而成的多肽链。', e:'氨基酸是蛋白质的基本单位，约20种，通过肽键连接形成多肽，再盘曲折叠成蛋白质。' },
  { b:1, c:'细胞的分子组成', q:'DNA和RNA共有的碱基是？', o:['A、T、C','A、G、C','A、T、G','T、G、C'], a:1,
    h:'DNA含A/T/G/C，RNA含A/U/G/C。', e:'两者共有的碱基是腺嘌呤(A)、鸟嘌呤(G)、胞嘧啶(C)。DNA特有胸腺嘧啶(T)，RNA特有尿嘧啶(U)。' },
  { b:1, c:'细胞的分子组成', q:'下列哪项不属于糖类？', o:['葡萄糖','蔗糖','胆固醇','淀粉'], a:2,
    h:'胆固醇属于脂质中的固醇类。', e:'葡萄糖是单糖，蔗糖是二糖，淀粉是多糖。胆固醇属于脂质中的固醇类物质。' },
  { b:1, c:'细胞的分子组成', q:'水在细胞中最重要的作用是？', o:['提供能量','作为溶剂','构成细胞膜','储存遗传信息'], a:1,
    h:'细胞内的化学反应几乎都在水环境中进行。', e:'水是极性分子，是良好的溶剂，细胞内绝大多数化学反应都在水溶液中进行。' },
  { b:1, c:'细胞的分子组成', q:'核酸的基本组成单位是？', o:['氨基酸','葡萄糖','核苷酸','脂肪酸'], a:2,
    h:'核酸是由核苷酸聚合而成的长链。', e:'核苷酸是核酸的基本单位，每个核苷酸由一分子磷酸、一分子五碳糖和一分子含氮碱基组成。' },
  { b:1, c:'细胞的分子组成', q:'脂质在细胞中不具有的功能是？', o:['储存能量','构成生物膜','催化化学反应','保温缓冲'], a:2,
    h:'催化功能是蛋白质（酶）的典型功能。', e:'脂质能储存能量（脂肪）、构成生物膜（磷脂）、保温和缓冲。催化是酶（蛋白质）的功能。' },
  { b:1, c:'细胞的分子组成', q:'DNA与RNA在化学组成上的区别是？', o:['碱基完全不同','五碳糖不同','都不含磷','都由氨基酸组成'], a:1,
    h:'DNA含脱氧核糖，RNA含核糖。', e:'DNA的五碳糖是脱氧核糖，RNA是核糖。此外DNA含T而RNA含U。两者都含磷，都由核苷酸组成。' },
  { b:1, c:'细胞的分子组成', q:'组成糖原的基本单位是？', o:['蔗糖','葡萄糖','果糖','麦芽糖'], a:1,
    h:'糖原是多糖，由许多单糖分子脱水缩合而成。', e:'糖原（动物淀粉）是多糖，基本单位是葡萄糖。糖原主要储存在肝脏和肌肉中。' },

  // ========== 必修一：细胞的结构 ==========
  { b:1, c:'细胞的结构', q:'细胞膜的基本骨架是？', o:['蛋白质','糖类','磷脂双分子层','核酸'], a:2,
    h:'细胞膜的主要成分是磷脂和蛋白质。', e:'磷脂双分子层是细胞膜的基本骨架，磷脂亲水头部朝外、疏水尾部朝内，蛋白质镶嵌或贯穿其中。' },
  { b:1, c:'细胞的结构', q:'原核细胞与真核细胞最主要的区别是？', o:['有无细胞壁','有无细胞膜','有无以核膜为界限的细胞核','有无核糖体'], a:2,
    h:'原核细胞没有成形的细胞核。', e:'原核细胞无核膜包被的细胞核，遗传物质集中在拟核。细菌、蓝藻是原核生物。' },
  { b:1, c:'细胞的结构', q:'被称为"动力工厂"的细胞器是？', o:['核糖体','高尔基体','线粒体','内质网'], a:2,
    h:'该细胞器是有氧呼吸的主要场所。', e:'线粒体是有氧呼吸主要场所，将有机物中化学能转化为ATP中的化学能，故称为"动力工厂"。' },
  { b:1, c:'细胞的结构', q:'植物细胞特有的细胞器是？', o:['线粒体','叶绿体','核糖体','内质网'], a:1,
    h:'该细胞器是光合作用的场所。', e:'叶绿体是植物细胞特有的细胞器，是光合作用的场所。线粒体、核糖体、内质网在动植物细胞中均有。' },
  { b:1, c:'细胞的结构', q:'下列哪种细胞器没有膜结构？', o:['内质网','高尔基体','核糖体','溶酶体'], a:2,
    h:'该细胞器由rRNA和蛋白质组成。', e:'核糖体无膜结构，由rRNA和蛋白质组成。中心体也是无膜细胞器。其余三者均有单层膜结构。' },
  { b:1, c:'细胞的结构', q:'分泌蛋白的合成和分泌路径是？', o:['核糖体→内质网→高尔基体→细胞膜','核糖体→高尔基体→内质网→细胞膜','内质网→核糖体→高尔基体→细胞膜','高尔基体→内质网→核糖体→细胞膜'], a:0,
    h:'核糖体合成肽链后进入内质网加工，再经高尔基体包装。', e:'路径：核糖体（合成）→内质网（加工）→高尔基体（分类包装）→囊泡→细胞膜（分泌）。' },

  // ========== 必修一：细胞的代谢 ==========
  { b:1, c:'细胞的代谢', q:'酶催化反应的原理是？', o:['提高反应物的能量','降低反应的活化能','改变反应的平衡点','提供反应所需的能量'], a:1,
    h:'酶不改变反应的方向和平衡，只是让反应更容易发生。', e:'酶通过降低化学反应的活化能来加速反应。酶不改变反应平衡点，自身在反应前后不变。' },
  { b:1, c:'细胞的代谢', q:'ATP的全称是？', o:['腺嘌呤','腺苷三磷酸','三磷酸腺苷','脱氧核苷酸'], a:1,
    h:'A=腺苷，T=三，P=磷酸。', e:'ATP全称腺苷三磷酸（Adenosine Triphosphate），结构简式A-P~P~P，是细胞内的直接能源物质。' },
  { b:1, c:'细胞的代谢', q:'光合作用释放的O₂来自哪种物质的分解？', o:['CO₂','H₂O','C₆H₁₂O₆','ATP'], a:1,
    h:'光反应中水在光的作用下分解产生氧气。', e:'光合作用释放的氧气全部来自水的光解。光反应阶段：水分解产生O₂、[H]和ATP。' },
  { b:1, c:'细胞的代谢', q:'有氧呼吸产生ATP最多的阶段是？', o:['第一阶段（糖酵解）','第二阶段（柠檬酸循环）','第三阶段（电子传递链）','三个阶段一样多'], a:2,
    h:'第三阶段发生在线粒体内膜上。', e:'第三阶段（电子传递链）产生约34个ATP。一分子葡萄糖彻底氧化共产生约38个ATP。' },
  { b:1, c:'细胞的代谢', q:'光合作用暗反应的场所是？', o:['类囊体薄膜','叶绿体基质','线粒体基质','细胞质基质'], a:1,
    h:'暗反应不需要光，但需要多种酶参与。', e:'暗反应（卡尔文循环）在叶绿体基质中进行，利用光反应产生的ATP和[H]将CO₂还原为糖类。' },
  { b:1, c:'细胞的代谢', q:'酶的特性不包括？', o:['高效性','专一性','作用条件温和','反应后自身被消耗'], a:3,
    h:'酶是催化剂，反应前后自身不发生变化。', e:'酶的特性：高效性、专一性、作用条件温和。酶作为催化剂在反应前后不被消耗。' },
  { b:1, c:'细胞的代谢', q:'有氧呼吸第一阶段（糖酵解）的场所是？', o:['线粒体基质','线粒体内膜','细胞质基质','叶绿体'], a:2,
    h:'葡萄糖分解成丙酮酸的过程发生在细胞质中。', e:'糖酵解在细胞质基质中进行，葡萄糖分解为丙酮酸，产生少量ATP和[H]。后两个阶段在线粒体中。' },
  { b:1, c:'细胞的代谢', q:'光合作用的光反应阶段产生什么？', o:['葡萄糖','CO₂和水','ATP和[H]','丙酮酸'], a:2,
    h:'光反应将光能转化为化学能储存在ATP和[H]中。', e:'光反应产生ATP、[H]（NADPH）和O₂。ATP和[H]供给暗反应还原CO₂合成有机物。' },

  // ========== 必修一：细胞的增殖 ==========
  { b:1, c:'细胞的增殖', q:'细胞周期中DNA复制发生在？', o:['G₁期','S期','G₂期','M期'], a:1,
    h:'S代表Synthesis（合成），是DNA合成的时期。', e:'DNA复制发生在分裂间期的S期。G₁期合成RNA和蛋白质，G₂期为分裂做准备，M期为分裂期。' },
  { b:1, c:'细胞的增殖', q:'有丝分裂后期染色体数目加倍的原因是？', o:['DNA复制','着丝粒分裂','细胞质分裂','纺锤体形成'], a:1,
    h:'后期着丝粒一分为二，姐妹染色单体分开。', e:'有丝分裂后期着丝粒分裂，姐妹染色单体分开成为两条子染色体，染色体数目暂时加倍（2N→4N）。' },
  { b:1, c:'细胞的增殖', q:'有丝分裂过程中消失又重现的结构是？', o:['染色体和纺锤体','核膜和核仁','着丝粒','中心体'], a:1,
    h:'前期核膜核仁消失，末期核膜核仁重新出现。', e:'前期核膜解体、核仁消失；末期核膜、核仁重新出现。染色体在前期出现、末期解螺旋。' },
  { b:1, c:'细胞的增殖', q:'动物细胞和植物细胞有丝分裂的区别主要在？', o:['前期和中期','后期','末期细胞质分裂方式','间期'], a:2,
    h:'植物细胞在赤道板位置形成细胞板，动物细胞细胞膜向内凹陷。', e:'动物细胞末期细胞膜从中部向内凹陷缢裂；植物细胞在赤道板处形成细胞板，进而形成新的细胞壁。' },

  // ========== 必修一：细胞的分化、衰老和凋亡 ==========

Q.forEach(function(q,i){ q.id = i+1; });

// ==============================  状态  ==============================
var picked = [], pos = 0, ok = 0, bad = 0, streak = 0, best = 0, done = false;
var TOTAL = 20;

function shuf(a) {
  var b = a.slice();
  for (var i = b.length-1; i>0; i--) { var j = Math.floor(Math.random()*(i+1)); var t=b[i]; b[i]=b[j]; b[j]=t; }
  return b;
}

// ==============================  渲染  ==============================
var letters = ['A','B','C','D'];

function show() {
  if (pos >= TOTAL || pos >= picked.length) { over(); return; }
  done = false;
  var q = picked[pos];

  document.getElementById('tag').textContent = (q.b===1?'必修一':'必修二') + ' · ' + q.c;
  document.getElementById('idx').textContent = '第 ' + (pos+1) + ' 题 / 共 ' + Math.min(TOTAL, picked.length) + ' 题';
  document.getElementById('stem').textContent = q.q;

  var ol = document.getElementById('opts');
  ol.innerHTML = '';
  q.o.forEach(function(txt, i){
    var li = document.createElement('li');
    var bt = document.createElement('button');
    bt.className = 'opt';
    bt.innerHTML = '<span class="letter">'+letters[i]+'</span><span>'+txt+'</span>';
    bt.onclick = (function(idx){ return function(){ pick(idx); }; })(i);
    li.appendChild(bt);
    ol.appendChild(li);
  });

  document.getElementById('fb').className = 'fb';
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('hintBtn').style.display = 'inline-block';
  bar();
}

function bar() {
  var pct = Math.round((pos / Math.min(TOTAL, picked.length)) * 100);
  document.getElementById('bar').style.width = pct + '%';
  document.getElementById('pnum').textContent = pos + '/' + Math.min(TOTAL, picked.length);
}

function nums() {
  document.getElementById('ok').textContent = ok;
  document.getElementById('bad').textContent = bad;
  document.getElementById('streak').textContent = streak;
}

// ==============================  答题  ==============================
function pick(chosen) {
  if (done) return;
  done = true;
  var q = picked[pos];
  var right = chosen === q.a;
  var bts = document.querySelectorAll('#opts .opt');

  bts.forEach(function(b){ b.disabled = true; });
  bts[q.a].classList.add('reveal');

  var fb = document.getElementById('fb');

  if (right) {
    bts[chosen].classList.add('correct');
    ok++; streak++;
    if (streak > best) best = streak;
    fb.className = 'fb ok on';
    fb.innerHTML = '✓ 正确 — ' + q.e;
  } else {
    bts[chosen].classList.add('wrong');
    bad++; streak = 0;
    fb.className = 'fb bad on';
    fb.innerHTML = '✗ 错误（选 '+letters[q.a]+'） — ' + q.e;
  }

  nums();
  document.getElementById('nextBtn').style.display = 'inline-block';
  document.getElementById('hintBtn').style.display = 'none';
}

function doHint() {
  if (done) return;
  var fb = document.getElementById('fb');
  fb.className = 'fb ok on';
  fb.innerHTML = '提示：' + picked[pos].h;
}
window.doHint = doHint;

function doNext() {
  pos++;
  if (pos >= TOTAL || pos >= picked.length) { over(); } else { show(); }
}
window.doNext = doNext;

// ==============================  结果  ==============================
function over() {
  document.getElementById('playArea').style.display = 'none';
  var area = document.getElementById('resultArea');
  area.classList.add('on');

  var t = ok + bad;
  var rate = t>0 ? Math.round(ok/t*100) : 0;

  var emj, title, tips = '';
  if (rate >= 90) {
    emj = '🌿'; title = '非常好，合格考稳了！';
    tips = '<li>回归课本，关注细节概念和易混淆点</li><li>适当练一些综合应用题保持手感</li>';
  } else if (rate >= 70) {
    emj = '🍃'; title = '不错，再巩固一下';
    tips = '<li>用荧光笔在课本上标出做错的知识点</li><li>重点复习光合与呼吸作用过程、遗传规律计算</li><li>多画概念图帮助理解和记忆</li>';
  } else if (rate >= 50) {
    emj = '📝'; title = '还需要多下功夫';
    tips = '<li>先梳理课本目录，建立知识框架</li><li>每天背5个核心概念，积少成多</li><li>重点关注：细胞结构、代谢过程、遗传分子基础</li>';
  } else {
    emj = '🌱'; title = '别灰心，从基础开始';
    tips = '<li>建议先通读必修一课本，再做题目练习</li><li>每天弄懂一个章节的核心概念</li><li>多请教老师或同学，多画结构图</li><li>坚持每天学习，基础一定会好起来</li>';
  }

  document.getElementById('remj').textContent = emj;
  document.getElementById('rtitle').textContent = title;
  document.getElementById('rdetail').innerHTML =
    '共答 <b>' + t + '</b> 题&ensp;·&ensp;正确 <b>' + ok + '</b> 题&ensp;·&ensp;错误 <b>' + bad + '</b> 题<br>正确率 <b>' + rate + '%</b>&ensp;·&ensp;最长连对 <b>' + best + '</b> 题';
  document.getElementById('rtips').innerHTML = '<h3>复习建议</h3>' + tips;
}

function restart() {
  picked = shuf(Q);
  pos = 0; ok = 0; bad = 0; streak = 0; best = 0; done = false;
  document.getElementById('playArea').style.display = 'block';
  document.getElementById('resultArea').classList.remove('on');
  nums(); show();
}
window.restart = restart;

// ==============================  启动  ==============================
picked = shuf(Q);
nums(); show();
</script>
</body>
</html>
